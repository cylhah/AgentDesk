<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentDesk · 座舱媒体</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #111823;
        --line: #1e2a3a;
        --text: #c7d5e5;
        --dim: #64798f;
        --accent: #38bdf8;
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
        --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #132033 0%, var(--bg) 60%);
        color: var(--text);
        font: 14px/1.55 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(10, 15, 22, 0.85);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .brand { font-weight: 650; letter-spacing: .2px; }
      .brand span { color: var(--dim); font-weight: 400; margin-left: 8px; }
      .status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px currentColor; }
      .dot.online { background: var(--ok); }
      .dot.offline { background: var(--bad); }
      .meta { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 12px; }
      main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 57px); }
      aside { border-right: 1px solid var(--line); padding: 16px; }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
      #sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      #sessions button {
        all: unset; cursor: pointer; display: block; width: 100%;
        padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); font-size: 12px; color: var(--text);
      }
      #sessions button:hover { border-color: var(--accent); }
      #sessions small { display: block; color: var(--dim); font-family: var(--mono); font-size: 11px; margin-top: 2px; }
      #timeline { padding: 20px 24px 120px; display: flex; flex-direction: column; gap: 10px; max-width: 1080px; }
      .empty { color: var(--dim); padding: 40px 0; }
      .row { display: flex; gap: 10px; align-items: baseline; }
      .turn-divider {
        display: flex; align-items: center; gap: 10px; color: var(--dim);
        font-family: var(--mono); font-size: 11px; margin-top: 8px;
      }
      .turn-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .bubble { max-width: 72ch; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
      .bubble.user { align-self: flex-end; border-color: #24405c; background: #122031; }
      .bubble.asst { border-left: 2px solid var(--accent); }
      .tag { font-family: var(--mono); font-size: 11px; color: var(--dim); }
      .tool { border: 1px solid var(--line); border-radius: 10px; background: #0e1620; overflow: hidden; }
      .tool .head { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; font-family: var(--mono); font-size: 12px; }
      .tool .name { color: var(--accent); }
      .tool .args { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool .out { padding: 0 12px 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: pre-wrap; word-break: break-all; }
      .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
      .note { color: var(--dim); font-size: 12px; }
      .approval {
        border: 1px solid #4a3a12; background: #1d1707; color: var(--warn);
        border-radius: 10px; padding: 10px 12px; font-size: 13px;
      }
      .end { font-family: var(--mono); font-size: 11px; color: var(--dim); }
      .end .reason { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">AgentDesk<span>座舱媒体 Agent · 只读看板</span></div>
      <div class="status"><span id="dot" class="dot"></span><span id="conn">连接中…</span></div>
      <div class="meta"><span id="seqinfo">seq 0</span> · <span id="tokens">0 tokens</span></div>
    </header>
    <main>
      <aside>
        <h2>会话</h2>
        <ul id="sessions"></ul>
      </aside>
      <section id="timeline"><div class="empty">等待事件…（跑一轮 <code>pnpm dev run</code> 后刷新）</div></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
